<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Rich emerald to warm amber/gold gradient -->
    <linearGradient id="favGreenGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="45%" stop-color="#34d399" />
      <stop offset="75%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Deep ambient dark glow for tab contrast -->
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#022c22" flood-opacity="0.9" />
    </filter>

    <!-- Radial backdrop aura -->
    <radialGradient id="favAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#021411" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Aura -->
  <circle cx="250" cy="250" r="240" fill="url(#favAura)" />

  <g filter="url(#favGlow)">
    <!-- 1. Deep Metallic Emerald Hexagon Base -->
    <polygon
      points="250,45 425,146 425,354 250,455 75,354 75,146"
      fill="#051c18"
      stroke="#10b981"
      stroke-width="12"
      stroke-linejoin="round"
    />

    <!-- 2. Glowing Warm Gold Inner Bevel Hexagon -->
    <polygon
      points="250,45 425,146 425,354 250,455 75,354 75,146"
      fill="none"
      stroke="#f5a623"
      stroke-width="5"
      stroke-dasharray="24 12"
      opacity="0.95"
      stroke-linejoin="round"
    />

    <!-- 3. Left Circuit Flow Track -->
    <path
      d="M 210,75 L 105,135 L 105,335 L 210,395"
      fill="none"
      stroke="url(#favGreenGoldGrad)"
      stroke-width="8"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- 4. Right Circuit Flow Track -->
    <path
      d="M 290,75 L 395,135 L 395,335 L 290,395"
      fill="none"
      stroke="url(#favGreenGoldGrad)"
      stroke-width="8"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- 5. Inner Cyber Guideline Hexagon -->
    <polygon
      points="250,95 375,167 375,323 250,395 125,323 125,167"
      fill="none"
      stroke="rgba(251, 191, 36, 0.45)"
      stroke-width="3"
      stroke-dasharray="10 6"
    />

    <!-- 6. Golden Circuit Nodes with High-Contrast Highlights -->
    <g>
      <circle cx="210" cy="75" r="9" fill="#f59e0b" stroke="#051c18" stroke-width="2.5" />
      <circle cx="290" cy="75" r="9" fill="#f59e0b" stroke="#051c18" stroke-width="2.5" />
      <circle cx="95" cy="235" r="9" fill="#f59e0b" stroke="#051c18" stroke-width="2.5" />
      <circle cx="405" cy="235" r="9" fill="#f59e0b" stroke="#051c18" stroke-width="2.5" />
      <circle cx="210" cy="395" r="9" fill="#f59e0b" stroke="#051c18" stroke-width="2.5" />
      <circle cx="290" cy="395" r="9" fill="#f59e0b" stroke="#051c18" stroke-width="2.5" />
    </g>

    <!-- 7. MU Brand Monogram (Bold, Sharp Geometric Typography) -->
    <g id="mu-monogram">
      <!-- 'M' Letterform Front Face with Gradient -->
      <polygon
        points="150,170 176,160 205,255 234,156 256,156 256,315 232,317 232,224 210,298 198,298 176,224 176,305 150,300"
        fill="url(#favGreenGoldGrad)"
      />
      <!-- 'M' 3D Emerald Right Bevel -->
      <polygon
        points="232,317 256,315 256,156 242,156 242,302"
        fill="#047857"
        opacity="0.95"
      />

      <!-- 'U' Letterform Front Face with Gradient -->
      <polygon
        points="272,158 296,161 296,268 322,271 322,170 346,176 346,300 272,324"
        fill="url(#favGreenGoldGrad)"
      />
      <!-- 'U' 3D Emerald Bottom Bevel -->
      <polygon
        points="272,324 346,300 346,312 272,334"
        fill="#047857"
        opacity="0.95"
      />
      <!-- 'U' 3D Emerald Inner Bevel -->
      <polygon
        points="296,268 322,271 322,280 296,277"
        fill="#047857"
        opacity="0.95"
      />
    </g>
  </g>
</svg>